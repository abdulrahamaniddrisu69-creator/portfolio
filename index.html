<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chairman Wan • Graphic Design Program 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .hero-bg {
      background: linear-gradient(135deg, #0f766e 0%, #6b21a8 100%);
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans" id="body">

  <nav class="fixed top-0 w-full bg-gray-900/80 backdrop-blur-md z-50">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-palette text-2xl text-teal-400"></i>
        <span class="font-bold text-2xl">Chairman Wan</span>
      </div>
      <button onclick="toggleTheme()" class="p-3 rounded-2xl hover:bg-gray-800 transition-colors">
        <i id="themeIcon" class="fa-solid fa-moon text-xl"></i>
      </button>
    </div>
  </nav>

  <div class="min-h-screen flex items-center justify-center pt-20 pb-12 px-6">
    <div class="max-w-md w-full bg-gray-900 rounded-3xl overflow-hidden shadow-2xl border border-gray-800">

      <div class="hero-bg p-8 text-center">
        <h1 class="text-4xl font-bold mb-2">Graphic Design Program</h1>
        <div class="flex items-center justify-center gap-2 mb-3">
          <span class="bg-white/20 text-white text-sm px-4 py-1 rounded-full font-medium">@2026</span>
        </div>
        <p class="text-teal-100">Application Form</p>
        <p class="text-sm text-teal-200 mt-2">Abdul Rahman Danaba Iddrisu</p>
      </div>

      <div class="p-8">
        <form id="registerForm" action="https://formspree.io/f/xykvbgog" method="POST" class="space-y-6">

          <!-- Profile Picture -->
          <div class="flex flex-col items-center">
            <div id="preview" class="w-24 h-24 rounded-2xl border-2 border-dashed border-teal-400 flex items-center justify-center overflow-hidden mb-3 bg-gray-800">
              <i class="fa-solid fa-user text-4xl text-gray-500"></i>
            </div>
            <label class="cursor-pointer text-teal-400 hover:text-teal-300 text-sm font-medium flex items-center gap-2">
              <i class="fa-solid fa-upload"></i>
              Upload Profile Picture
              <input type="file" name="profile_picture" id="profilePic" accept="image/*" class="hidden" onchange="previewImage(event)">
            </label>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-2">First Name</label>
              <input type="text" name="first_name" class="w-full px-5 py-4 bg-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="Iddrisu" required>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Last Name</label>
              <input type="text" name="last_name" class="w-full px-5 py-4 bg-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="Abdul" required>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2">Username / Portfolio Name</label>
            <input type="text" name="username" class="w-full px-5 py-4 bg-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="@iddrisudesigner" required>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2">Email Address</label>
            <input type="email" name="email" class="w-full px-5 py-4 bg-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="you@creative.com" required>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2">Country</label>
            <select name="country" class="w-full px-5 py-4 bg-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500" required>
              <option value="">Select Country</option>
              <option value="Ghana">Ghana</option>
              <option value="Nigeria">Nigeria</option>
              <option value="Kenya">Kenya</option>
              <option value="USA">United States</option>
              <option value="UK">United Kingdom</option>
              <option value="India">India</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2">Skill Level</label>
            <select name="skill_level" class="w-full px-5 py-4 bg-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500" required>
              <option value="">Select Level</option>
              <option value="Beginner">Beginner</option>
              <option value="Intermediate">Intermediate</option>
              <option value="Advanced">Advanced</option>
              <option value="Professional">Professional</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2">Skills</label>
            <textarea name="skills" rows="3" class="w-full px-5 py-4 bg-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="Photoshop, Illustrator, Figma, etc." required></textarea>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2">Why do you want to join this program?</label>
            <textarea name="motivation" rows="5" class="w-full px-5 py-4 bg-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="Explain your reasons and goals..." required></textarea>
          </div>

          <div class="flex items-center gap-3">
            <input type="checkbox" class="w-5 h-5 accent-teal-500" required>
            <p class="text-sm text-gray-400">
              I agree to the <a href="#" class="text-teal-400 hover:underline">Terms</a> & <a href="#" class="text-teal-400 hover:underline">Privacy</a>
            </p>
          </div>

          <button type="submit" 
            class="w-full py-4 bg-gradient-to-r from-teal-500 to-purple-600 rounded-2xl font-semibold text-lg hover:scale-105 transition-all active:scale-95">
            Submit Application
          </button>
        </form>

        <!-- Contact & Social Media -->
        <div class="mt-8 p-5 bg-gray-800/50 rounded-2xl text-center">
          <p class="font-medium mb-3">For Enquiries & Follow Updates:</p>
          
          <div class="flex justify-center gap-6 text-2xl mb-4">
            <a href="https://wa.me/233548197534" target="_blank" class="text-green-400 hover:scale-110 transition-transform">
              <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="#" target="_blank" class="text-pink-400 hover:scale-110 transition-transform">
              <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="#" target="_blank" class="text-blue-400 hover:scale-110 transition-transform">
              <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="#" target="_blank" class="text-black hover:scale-110 transition-transform">
              <i class="fa-brands fa-tiktok"></i>
            </a>
          </div>

          <p class="text-teal-400 font-medium">Abdul Rahman Danaba Iddrisu</p>
          <p class="text-xs text-gray-400 mt-1">@2026 Graphic Design Program</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function previewImage(event) {
      const preview = document.getElementById('preview');
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
        }
        reader.readAsDataURL(file);
      }
    }

    function toggleTheme() {
      const body = document.getElementById('body');
      const icon = document.getElementById('themeIcon');
      if (body.classList.contains('light-mode')) {
        body.classList.remove('light-mode');
        icon.classList.replace('fa-sun', 'fa-moon');
      } else {
        body.classList.add('light-mode');
        icon.classList.replace('fa-moon', 'fa-sun');
      }
    }

    document.getElementById('registerForm').addEventListener('submit', function() {
      setTimeout(() => {
        alert(" Application submitted successfully!\nWe will review it and get back to you soon.");
      }, 800);
    });
  </script>

  <style>
    .light-mode {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    .light-mode .bg-gray-900 { background-color: white !important; border-color: #e2e8f0; }
    .light-mode .bg-gray-800 { background-color: #f1f5f9 !important; }
    .light-mode input, .light-mode select, .light-mode textarea { color: #0f172a; }
  </style>
</body>
</html>
